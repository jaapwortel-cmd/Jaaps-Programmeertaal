# Zet Jaaps handtekening (certificaat CN=Jaap Wortel) op het installatiebestand van de uitgave "proef".
# In handtekening/ staat alleen de handtekening zelf (openbaar deel + ondertekening), nooit de geheime sleutel.
# De handtekening hoort bij precies één installatiebestand: de controle met sha256 stopt als het een ander is.
name: Handtekening toevoegen

on:
  push:
    paths:
      - 'handtekening/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ondertekenen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Handtekening aan het installatiebestand vastmaken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sudo apt-get install -y -q osslsigncode >/dev/null
          gh release download proef -p '*installatie.exe' -D los
          bestand=$(ls los/*installatie.exe | head -1)
          echo "$(cat handtekening/installatie.sha256)  $bestand" | sha256sum -c -
          naam="Jaaps Programmeertaal 0.1.0 installatie (ondertekend).exe"
          osslsigncode attach-signature -sigin handtekening/installatie.p7 -in "$bestand" -out "$naam" || true
          openssl x509 -inform DER -in "Certificaat Jaap Wortel.cer" -out jaap.pem
          osslsigncode verify -in "$naam" -CAfile jaap.pem | tee controle.txt
          grep -q "Signature verification: ok" controle.txt
          gh release upload proef "$naam" --clobber
